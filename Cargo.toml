[workspace]
resolver = "2"
members = ["crates/sp_core", "crates/sp_sim", "crates/sp_economy", "crates/sp_league", "crates/sp_tools", "app"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }
