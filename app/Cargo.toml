[package]
name = "semi-pro-football"
description = "Semi-Pro Football: a small-town football management sim (Qt 6 / QML UI)."
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
sp_core = { path = "../crates/sp_core" }
sp_sim = { path = "../crates/sp_sim" }
sp_economy = { path = "../crates/sp_economy" }
sp_league = { path = "../crates/sp_league" }
serde.workspace = true
serde_json.workspace = true
cxx = "1.0.205"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_gui", "qt_qml", "qt_quickcontrols"] }

[build-dependencies]
cxx-qt-build = "0.10.0"
